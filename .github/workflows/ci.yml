name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run tests
        run: ./tests/run.sh

