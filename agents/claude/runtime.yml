# Claude Code runtime.
#
# MANIFEST SCOPE: this file declares only what ASF reads from it TODAY —
# identity, state volumes, LLM/broker settings, network policy, secrets, and
# static env. Repository mounts stay in agents/claude/repos.yml and deployment
# hardening in asf.conf. Unknown keys are rejected, so this file cannot drift
# silently.

name: claude
description: Claude Code interactive CLI
adapter: claude

runtime:
  mode: interactive
  isolation: container  # container or microvm

filesystem:
  state:
    - key: config
      target: /home/node/.claude

llm:
  broker: true
  protocol: anthropic     # wire protocol the agent speaks TO the broker
  provider: anthropic     # upstream provider LiteLLM talks to
  # api_key_env defaults to <PROVIDER>_API_KEY (ANTHROPIC_API_KEY)
  # direct_domain is derived for known providers (api.anthropic.com)
  # models omitted => wildcard route, every model the key can reach

# Optional runtime capabilities (default: none).
# NET_RAW is the only supported capability. With microVM isolation it requires routed mode.
# Uncomment only when the workload needs raw sockets (for example SYN scans).
# capabilities: [net_raw]

observability:
  # true stores full broker-visible prompts on the host (0600).
  llm_prompts: false
  # routed+microvm only; records TCP SYN, UDP and ICMP echo attempts, no payloads.
  network_activity: false

# Network policy is agent-agnostic: choose one mode and keep only that mode's
# fields active. Proxy is the usual default for interactive agents.
network:
  # proxy -> domain allowlist through Caddy
  mode: proxy
  verify_domain: statsig.com
  allow_domains:
    - api.anthropic.com
    - statsig.com
    - sentry.io
    - console.anthropic.com
    - claude.ai
    - claude.com
    - platform.claude.com

  # routed -> explicit destination CIDRs; optional protocol/port restrictions
  # mode: routed
  # allow:
  #   - cidr: 192.0.2.10/32       # destination only = all IP traffic
  #   # - cidr: 198.51.100.20/32
  #   #   protocol: tcp
  #   #   ports: [22, 443]
  # Optional controlled live policy proof:
  # verify:
  #   address: 192.0.2.10
  #   protocol: tcp
  #   port: 22
  #   blocked_port: 19999

  # isolated -> no direct external destination fields
  # mode: isolated

secrets:
  files:
    - common.env
    - claude.env

env:
  CLAUDE_CONFIG_DIR: /home/node/.claude
