# Hermes runtime.
#
# MANIFEST SCOPE: see agents/claude/runtime.yml — this file declares only what
# ASF reads from it today.

name: hermes
description: Hermes agent interactive CLI
adapter: hermes

runtime:
  mode: interactive
  isolation: container  # container or microvm

filesystem:
  state:
    - key: config
      target: /home/node/.hermes

llm:
  broker: true
  protocol: openai        # Hermes speaks OpenAI Chat Completions to the broker
  provider: openai        # upstream provider; change this to switch providers
  # api_key_env defaults to OPENAI_API_KEY; direct_domain to api.openai.com
  # models omitted => wildcard route

# Optional runtime capabilities (default: none).
# NET_RAW is the only supported capability. With microVM isolation it requires routed mode.
# Uncomment only when the workload needs raw sockets (for example SYN scans).
# capabilities: [net_raw]

observability:
  # true stores full broker-visible prompts on the host (0600).
  llm_prompts: false

# Network policy is agent-agnostic: choose one mode and keep only that mode's
# fields active. Proxy is the usual default for interactive agents.
network:
  # proxy -> domain allowlist through Caddy
  mode: proxy
  # Broker mode needs no direct external destinations by default. Tirith is
  # installed in the image and runs offline. Add only workload-required hosts.
  allow_domains: []

  # routed -> explicit destination CIDRs; optional protocol/port restrictions
  # mode: routed
  # allow:
  #   - cidr: 192.0.2.10/32       # destination only = all IP traffic
  #   # - cidr: 198.51.100.20/32
  #   #   protocol: tcp
  #   #   ports: [22, 443]
  # Optional controlled live policy proof:
  # verify:
  #   address: 192.0.2.10
  #   protocol: tcp
  #   port: 22
  #   blocked_port: 19999

  # isolated -> no direct external destination fields
  # mode: isolated

secrets:
  files:
    - common.env
    - hermes.env

# Static environment for the agent process. These are Hermes' own guardrails,
# enforced by Hermes — not by ASF. ASF's boundaries are the container, network
# topology, generated policy, and non-root user.
env:
  HERMES_WRITE_SAFE_ROOT: /workspace/repos:/home/node/.hermes
  HERMES_YOLO_MODE: "0"
  HERMES_REDACT_SECRETS: "true"
  TIRITH_OFFLINE: "1"
