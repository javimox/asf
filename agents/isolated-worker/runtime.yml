# A worker with NO direct external network path.
#
# `isolated` does NOT mean offline. This runtime can still reach:
#   - the LiteLLM broker (which forwards to a provider on its own network)
#   - runtime-local internal services
#
# It means the runtime itself cannot open a connection to the internet.
# Separate ASF runtimes are not connected by default. Data can still leave
# through the broker.
name: isolated-worker
description: Worker with no direct external path (internal services only)
adapter: generic

runtime:
  mode: interactive
  isolation: container  # container or microvm

# Optional runtime capabilities (default: none).
# NET_RAW is the only supported capability. With microVM isolation it requires routed mode.
# capabilities: [net_raw]

# Network policy is agent-agnostic; this example intentionally uses isolated.
network:
  # proxy -> domain allowlist through Caddy
  # mode: proxy
  # verify_domain: github.com
  # allow_domains:
  #   - github.com
  #   - objects.githubusercontent.com
  #   - raw.githubusercontent.com

  # routed -> explicit destination CIDRs
  # mode: routed
  # allow:
  #   - cidr: 192.0.2.10/32

  # isolated -> no direct external destination fields
  mode: isolated

filesystem:
  state:
    - key: cache
      target: /home/node/.cache

llm:
  broker: true
  protocol: openai
  provider: openai

observability:
  # Prompt capture is available only when the LiteLLM broker is enabled.
  llm_prompts: false

secrets:
  files:
    - common.env
    - isolated-worker.env

env:
  PYTHONUNBUFFERED: "1"
