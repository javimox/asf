# LangGraph runtime.
#
# ASF sandboxes your LangGraph application as ONE workload. The adapter here is
# thin: it declares how to install LangGraph and which directories to persist.
# It defines NO security policy — the container, network policy, non-root user, and
# broker are ASF's, identical for every runtime.
#
# ISOLATION LIMIT: if your app defines several logical agents (graph nodes),
# ASF isolates the application from the host, NOT those agents from each other.
# They share this container's filesystem, environment, and credentials.

name: langgraph
description: LangGraph application (single-workload sandbox)
adapter: generic          # image: no agent product baked in; deps install below

runtime:
  # interactive: a shell — install, run, iterate. To run the app directly:
  #   mode: service
  #   command: ["python", "-m", "my_graph.main"]
  mode: interactive

filesystem:
  state:
    # The venv lives on a volume, so dependencies install once, not per session.
    - key: venv
      target: /home/node/.venv
    - key: cache
      target: /home/node/.cache

llm:
  broker: true
  protocol: openai        # LangGraph speaks OpenAI-compatible APIs to the broker
  provider: openai        # upstream provider; change freely
  # models:               # omit => every model the key can reach
  #   - gpt-5.5

# network.allow_domains is the COMPLETE allowlist for this runtime.
# There is no implicit base list: what is not here cannot be reached.
# Add git hosts only if this runtime pushes from inside the container; the
# default workflow (commit inside, push from the host) does not need them.
network:
  mode: proxy
  # Positive control for startup verification: must be in the list below.
  verify_domain: pypi.org
  allow_domains:
    - pypi.org
    - files.pythonhosted.org

secrets:
  files:
    - common.env
    - langgraph.env

env:
  PYTHONUNBUFFERED: "1"
  # LangSmith tracing would call out to the network; off by default.
  LANGCHAIN_TRACING_V2: "false"
