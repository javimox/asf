# Example: a Python agent application sandboxed as ONE workload.
#
# This single manifest fits LangGraph, CrewAI, smolagents, or any custom Python
# agent — ASF does not need to understand the application's internal framework.
# The bundled example uses an OpenAI-compatible LiteLLM route, but a copied
# runtime may declare another supported protocol, provider, and credential.
#
# To use: copy this directory to agents/<your-name>/, set `name:` to match,
# adjust network.allow_domains, add repositories with
# `./sandbox.sh repo add <your-name> <path>`, then open the runtime.
#
# IMPORTANT LIMIT: if your app defines several logical agents (CrewAI crew
# members, LangGraph nodes), ASF isolates the APPLICATION from the host — it
# does NOT isolate those agents from each other. They share this container's
# filesystem, environment, and credentials.

name: python-agent
description: Generic Python agent application (LangGraph / CrewAI / smolagents)
adapter: generic          # no agent product installed; python3, pip, uv present

runtime:
  # interactive: you get a shell — install deps, run, iterate. Best while
  # developing. Switch to `service` plus a command to run the app directly:
  #
  #   mode: service
  #   command: ["python", "-m", "my_app.main"]
  #
  mode: interactive
  isolation: container  # container or microvm

filesystem:
  state:
    # Survives across sessions; good for a package cache so you do not
    # re-download dependencies on every start.
    - key: cache
      target: /home/node/.cache

llm:
  broker: true
  protocol: openai        # what your app speaks TO the broker
  provider: openai        # upstream provider LiteLLM talks to; swap freely
  # models:               # omit for every model the key can reach
  #   - gpt-5.5

# Optional runtime capabilities (default: none).
# NET_RAW is the only supported capability. With microVM isolation it requires routed mode.
# Uncomment only when the workload needs raw sockets (for example SYN scans).
# capabilities: [net_raw]

observability:
  # true stores full broker-visible prompts on the host (0600).
  llm_prompts: false
  # routed+microvm only; records TCP SYN, UDP and ICMP echo attempts, no payloads.
  network_activity: false

# Network policy is agent-agnostic: choose one mode and keep only that mode's
# fields active. Proxy is the usual default for interactive agents.
network:
  # proxy -> domain allowlist through Caddy
  mode: proxy
  verify_domain: pypi.org
  allow_domains:
    - pypi.org
    - files.pythonhosted.org

  # routed -> explicit destination CIDRs; optional protocol/port restrictions
  # mode: routed
  # allow:
  #   - cidr: 192.0.2.10/32       # destination only = all IP traffic
  #   # - cidr: 198.51.100.20/32
  #   #   protocol: tcp
  #   #   ports: [22, 443]
  # Optional controlled live policy proof:
  # verify:
  #   address: 192.0.2.10
  #   protocol: tcp
  #   port: 22
  #   blocked_port: 19999

  # isolated -> no direct external destination fields
  # mode: isolated

secrets:
  files:
    - common.env
    - python-agent.env    # rename to match `name:` above

# Your app's own settings. ASF passes these through unchanged.
env:
  PYTHONUNBUFFERED: "1"

# Repository mounts remain in agents/<name>/repos.yml. Use:
# ./sandbox.sh repo add <name> <path> [--mode ro|rw]
