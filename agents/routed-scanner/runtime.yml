# Example routed scanner runtime — the address below is a PLACEHOLDER.
#
# 192.0.2.0/24 is TEST-NET-1 (RFC 5737), reserved for documentation. Replace
# it with a target you are authorised to scan. Routed mode does not require the
# target to expose any known-open service before the runtime starts.
#
# `network.verify` is optional. It is useful for controlled acceptance tests
# where you already know one allowed TCP endpoint and one known-open endpoint
# that policy must block. Normal pentest/discovery sessions can omit it.

name: routed-scanner
adapter: generic
runtime:
  mode: interactive
  isolation: microvm  # microvm or container

# Network policy is agent-agnostic; this example intentionally uses routed.
network:
  # Proxy example (replace the routed fields below):
  # mode: proxy
  # verify_domain: github.com
  # allow_domains:
  #   - github.com
  #   - objects.githubusercontent.com
  #   - raw.githubusercontent.com

  # Isolated example (replace the routed fields below):
  # mode: isolated

  mode: routed
  allow:
    # Narrow to /32 unless the workload genuinely needs a range. For a full
    # pentest target, omit protocol/ports to allow all IP traffic to this CIDR.
    - cidr: 192.0.2.10/32
      protocol: tcp
      ports: [18080]

  # Optional live policy proof. Both endpoints must already be reachable from
  # the host. `blocked_address` defaults to `address`; use a separate address
  # when the allowed destination itself permits all ports/protocols.
  # verify:
  #   address: 192.0.2.10
  #   protocol: tcp
  #   port: 18080
  #   blocked_address: 192.0.2.11
  #   blocked_port: 19999


observability:
  # Requires llm.broker: true; stores full broker-visible prompts (0600).
  llm_prompts: false
  # routed+microvm only; records passive TAP metadata, no packet payloads.
  network_activity: false

# Optional runtime capabilities (default: none).
# NET_RAW is only needed for raw-socket scans (for example SYN scans or OS
# detection). Uncomment it when needed. With microVM isolation, NET_RAW requires routed mode.
# capabilities: [net_raw]
# This generic scanner does not need an LLM. Broker-enabled microVM agents may use
# the same routed policy; ASF gives the guest a separate TCP/4000-only path to
# its session LiteLLM broker.
llm:
  broker: false
