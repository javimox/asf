# smolagents runtime.
#
# ASF sandboxes your smolagents application as ONE workload. The adapter here is
# thin: it declares how to install smolagents and which directories to persist.
# It defines NO security policy — the container, network policy, non-root user, and
# broker are ASF's, identical for every runtime.
#
# ISOLATION LIMIT: if your app defines several logical agents (managed agents),
# ASF isolates the application from the host, NOT those agents from each other.
# They share this container's filesystem, environment, and credentials.

name: smolagents
description: smolagents application (single-workload sandbox)
adapter: generic          # image: no agent product baked in; deps install below

runtime:
  # interactive: a shell — install, run, iterate. To run the app directly:
  #   mode: service
  #   command: ["python", "-m", "my_agent.main"]
  mode: interactive
  isolation: container  # container or microvm

filesystem:
  state:
    # The venv lives on a volume, so dependencies install once, not per session.
    - key: venv
      target: /home/node/.venv
    - key: cache
      target: /home/node/.cache

llm:
  broker: true
  protocol: openai        # smolagents speaks OpenAI-compatible APIs to the broker
  provider: openai        # upstream provider; change freely
  # models:               # omit => every model the key can reach
  #   - gpt-5.5

# Optional runtime capabilities (default: none).
# NET_RAW is the only supported capability. With microVM isolation it requires routed mode.
# Uncomment only when the workload needs raw sockets (for example SYN scans).
# capabilities: [net_raw]

observability:
  # true stores full broker-visible prompts on the host (0600).
  llm_prompts: false
  # routed+microvm only; records TCP SYN, UDP and ICMP echo attempts, no payloads.
  network_activity: false

# Network policy is agent-agnostic: choose one mode and keep only that mode's
# fields active. Proxy is the usual default for interactive agents.
network:
  # proxy -> domain allowlist through Caddy
  mode: proxy
  verify_domain: pypi.org
  allow_domains:
    - pypi.org
    - files.pythonhosted.org

  # routed -> explicit destination CIDRs; optional protocol/port restrictions
  # mode: routed
  # allow:
  #   - cidr: 192.0.2.10/32       # destination only = all IP traffic
  #   # - cidr: 198.51.100.20/32
  #   #   protocol: tcp
  #   #   ports: [22, 443]
  # Optional controlled live policy proof:
  # verify:
  #   address: 192.0.2.10
  #   protocol: tcp
  #   port: 22
  #   blocked_port: 19999

  # isolated -> no direct external destination fields
  # mode: isolated

secrets:
  files:
    - common.env
    - smolagents.env

env:
  PYTHONUNBUFFERED: "1"
