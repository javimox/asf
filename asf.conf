# ═══════════════════════════════════════════════════════════════════════════════
# asf.conf — trusted ASF settings parsed by the Python host CLI
#
# This file replaces the former dependencies.conf, broker.conf, and
# container-hardening.conf. Five sections:
#
#   1. BUILD       pinned versions baked into the image (rebuild on change)
#   2. BROKER      optional LiteLLM credential broker (no rebuild)
#   3. PROXY       which egress proxy enforces the allowlist
#   4. ROUTED      subnet pool and gateway compatibility policy
#   5. HARDENING   container privileges and resource limits (no rebuild)
#
# Two other files remain separate, on purpose:
#   agents/<name>/repos.yml      — machine-edited by `./sandbox.sh repo ...`
#   agents/<name>/runtime.yml    — per-runtime manifest (LLM, network, state)
#
# Keep this file trusted. The parser accepts only simple KEY=value assignments and never executes it.
# ═══════════════════════════════════════════════════════════════════════════════


# ═══ 1. BUILD ══════════════════════════════════════════════════════════════════
# Passed as Docker build arguments. Changing any of these rebuilds the image.
#
# Before a public release, pin the image references below by content digest:
# run tools/pin_digests.sh on the release host. Tags are mutable; digests make
# the deployment reproducible and keep the SBOM claims honest. The Caddy
# builder/runtime images are already digest-pinned in asf/proxy.py.
NODE_IMAGE=node:22.23.1-bookworm-slim
UV_IMAGE=ghcr.io/astral-sh/uv:0.11.31
SEMGREP_VERSION=1.171.0
CLAUDE_CODE_VERSION=2.1.216
HERMES_AGENT_COMMIT=f9eca7e15f1c2bfe5194aae5aa489af53c0a1a23
GIT_DELTA_VERSION=0.18.2
FZF_VERSION=0.74.1
FZF_SHA256_AMD64=df53438be5f51e151bb4044d78fda72bdfe209e3ecd2baecae48e8dea370c81b
FZF_SHA256_ARM64=f22204dd1a091d43e102268d062fd53b47133c8d8581671ee5eb225b75e31183
ZSH_IN_DOCKER_VERSION=1.2.0


# ═══ 2. BROKER ═════════════════════════════════════════════════════════════════
# When enabled, the agent receives only a short-lived local token. The reusable
# provider key is exposed only to the LiteLLM container, via a temporary Podman
# secret mounted as a file.
BROKER_ENABLED=true
LITELLM_IMAGE=ghcr.io/berriai/litellm:v1.93.0

# Per-runtime LLM settings (provider, protocol, models, key variable, blocked
# direct domain) live in agents/<name>/runtime.yml — one file per runtime, so
# adding a runtime needs no edit here.

# Maximum time to wait for the local LiteLLM health endpoint.
LITELLM_STARTUP_TIMEOUT=60

# Temporary troubleshooting only. Detailed logs may contain request content or
# credentials.
LITELLM_DETAILED_DEBUG=false


# Production egress proxy. Caddy is mandatory because it is the only tested
# implementation that combines private/special-address denial with port-443
# enforcement on both CONNECT and plain-HTTP paths. g3proxy and tinyproxy stay
# in tests/experiments/compare-tinyproxy-caddy.sh for comparison and are rejected by the normal
# lifecycle.
PROXY_IMPL=caddy

# Per-session JSON access logs for CONNECT and plain-HTTP proxy requests.
# Sensitive credentials are redacted by Caddy. ASF summarizes the logs during
# teardown and uses recent summaries for `sandbox.sh advise <agent>`. Raw files
# are size-rotated inside the session evidence directory. Raw evidence covers
# the latest 12 sessions; compact summaries cover the latest 100. Disable when
# request metadata should not be retained or advised on.
CADDY_ACCESS_LOGS=true


# ═══ 4. ROUTED MODE ════════════════════════════════════════════════════════════
# Pool that routed sessions allocate their private subnets from. Candidates are
# chosen deterministically per session and checked for overlap against podman
# networks, host routes (VPNs included) and the CIDRs a manifest declares as
# routed targets. Allocation FAILS CLOSED rather than guessing.
#
# Widen this if allocation fails, or move it if it collides with your LAN.
ASF_SUBNET_POOL=10.203.0.0/16
ASF_SUBNET_PREFIX=24

# Routed gateways use a capability-less holder plus a short-lived NET_ADMIN
# initializer. Keep this false unless the host cannot apply ip_forward at
# container creation and the security downgrade is explicitly accepted.
ROUTED_ALLOW_PERSISTENT_NET_ADMIN=false


# ═══ 5. HARDENING ══════════════════════════════════════════════════════════════
# Applied as Podman run-args at container start. Changing these only needs
# ./sandbox.sh open (no image rebuild).
#
# Adapted from the wnstify Hermes sandbox compose, translated to rootless Podman.
#
# IMPORTANT: sandbox.sh ALWAYS adds an empty, read-only tmpfs over
# /workspace/sandbox/secrets. That mask is intentionally NOT controlled by this
# section or by EXTENDED_HARDENING_ENABLED: it prevents the project-root bind mount from
# exposing host-side *.env files. It uses Podman's `notmpcopyup`; omitting that
# option can copy the underlying secrets directory into a nested tmpfs.

# Switch for the OPTIONAL limits below only: memory, CPU, PIDs, ulimits,
# tmpfs, private IPC. It does NOT control the security boundary.
#
# These are enforced unconditionally by the Python runtime and cannot be disabled
# from this file:
#   --cap-drop=ALL          no capabilities
#   no-new-privileges       no privilege escalation
#   ip_forward=0 (v4+v6)    a runtime is never a router
# The only capability a manifest may request is NET_RAW; NET_ADMIN is rejected.
EXTENDED_HARDENING_ENABLED=true



# ── Resource limits ───────────────────────────────────────────────────────────
PIDS_LIMIT=256          # max processes (fork-bomb protection)
MEM_LIMIT=3g            # hard memory ceiling      (--memory)
MEM_RESERVATION=512m    # soft floor               (--memory-reservation)
CPUS=1.8                # CPU cores                (--cpus)

# ── ulimits ───────────────────────────────────────────────────────────────────
ULIMIT_NOFILE_SOFT=4096
ULIMIT_NOFILE_HARD=65536
ULIMIT_NPROC_SOFT=256
ULIMIT_NPROC_HARD=256
# core=0 disables core dumps — critical: prevents secrets in memory from being
# written to a core file on the shared filesystem.
ULIMIT_CORE=0

# ── tmpfs ─────────────────────────────────────────────────────────────────────
# Mount /tmp and /run as tmpfs with nosuid,nodev so dropped binaries there
# cannot escalate. NOTE: /tmp is NOT noexec because some tool installers
# (uv, npm postinstall) execute from /tmp; /run IS noexec.
#
# These are optional working tmpfs mounts. The mandatory secrets/ mask described
# above is emitted separately by the Python Dev Container renderer and remains active if this section
# or all optional hardening is disabled.
TMPFS_ENABLED=true
TMPFS_TMP="rw,nosuid,nodev,size=512m"
TMPFS_RUN="rw,nosuid,nodev,noexec,size=64m"

# ── ipc ───────────────────────────────────────────────────────────────────────
IPC_PRIVATE=true        # private IPC namespace (no shared-memory leakage)

# ── SSH agent forwarding ──────────────────────────────────────────────────────
# Default OFF: commit inside, push from the host — no credential enters the
# container. Full rationale, setup, and risks: README.md "Git workflow".
#
# To enable: point SSH_AGENT_SOCKET at a DEDICATED agent holding ONE deploy
# key (never your desktop/keyring agent — the container can sign with every
# identity the agent holds, for the whole session). No auto-discovery: the
# explicit path means the startup log records exactly what was exposed.
SSH_AGENT_FORWARDING=false
SSH_AGENT_SOCKET=""
